<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My reservations')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<header class="sl-page-header">
    <div class="container">
        <div class="row align-items-center g-3">
            <div class="col-lg-8"><span class="sl-eyebrow">Guest account</span><h1 class="mb-2">My reservations</h1><p class="text-secondary mb-0">Track pending, confirmed, completed, and cancelled booking records.</p></div>
            <div class="col-lg-4 d-lg-flex justify-content-lg-end"><a class="btn btn-gold" th:href="@{/rooms}"><i class="bi bi-search"></i>Find a Room</a></div>
        </div>
    </div>
</header>
<main class="container py-5">
    <div class="table-responsive" th:unless="${reservations.empty}">
        <table class="table align-middle mb-0">
            <thead><tr><th>Reference</th><th>Room</th><th>Dates</th><th>Guests</th><th>Total</th><th>Status</th><th><span class="visually-hidden">Actions</span></th></tr></thead>
            <tbody>
            <tr th:each="reservation : ${reservations}">
                <td class="fw-bold" th:text="${reservation.reservationReference}"></td>
                <td><strong th:text="${reservation.room.roomType.name}"></strong><div class="small text-secondary" th:text="${'Room ' + reservation.room.roomNumber}"></div></td>
                <td th:text="${#temporals.format(reservation.checkInDate,'dd MMM yyyy') + ' – ' + #temporals.format(reservation.checkOutDate,'dd MMM yyyy')}"></td>
                <td th:text="${reservation.guestCount}"></td>
                <td class="fw-semibold" th:text="${'LKR ' + #numbers.formatDecimal(reservation.totalAmount,1,0)}"></td>
                <td><span class="sl-status" th:classappend="${' sl-status--' + #strings.toLowerCase(#strings.replace(reservation.status.name(), '_', '-'))}" th:text="${#strings.capitalizeWords(#strings.toLowerCase(#strings.replace(reservation.status.name(), '_', ' ')))}"></span></td>
                <td class="text-end"><a class="btn btn-sm btn-outline-success" th:href="@{/customer/reservations/{id}(id=${reservation.id})}">View</a></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${reservations.empty}" class="card empty-state">
        <i class="bi bi-calendar2-plus fs-1"></i><h2 class="h4 mt-3">No reservations yet</h2><p>Your reservation history will appear here after you book a room.</p><a class="btn btn-gold mx-auto" th:href="@{/rooms}">Check Availability</a>
    </div>
    <nav class="mt-4" th:if="${reservations.totalPages > 1}" aria-label="Reservation pages">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${reservations.first} ? 'disabled'"><a class="page-link" th:href="@{/customer/reservations(page=${reservations.number-1})}">Previous</a></li>
            <li class="page-item disabled"><span class="page-link" th:text="${'Page ' + (reservations.number+1) + ' of ' + reservations.totalPages}"></span></li>
            <li class="page-item" th:classappend="${reservations.last} ? 'disabled'"><a class="page-link" th:href="@{/customer/reservations(page=${reservations.number+1})}">Next</a></li>
        </ul>
    </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
