<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Scheduled maintenance')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: alerts}"></div><main class="container py-5"><h1>Scheduled maintenance</h1><p>Blocks use an inclusive start and exclusive end date. Existing reservations must be resolved first.</p><form th:action="@{/staff/rooms/maintenance}" method="post" class="card p-4"><label for="room" class="form-label">Room</label><select id="room" name="roomId" required class="form-select"><option th:each="r:${rooms}" th:value="${r.id}" th:text="${r.roomNumber}"></option></select><div class="row g-3 mt-2"><div class="col-md-6"><label for="start" class="form-label">Start date</label><input id="start" name="start" type="date" required class="form-control"></div><div class="col-md-6"><label for="end" class="form-label">End date (room released)</label><input id="end" name="end" type="date" required class="form-control"></div></div><label for="reason" class="form-label mt-3">Reason</label><input id="reason" name="reason" maxlength="500" required class="form-control"><button class="btn btn-gold mt-3">Schedule maintenance</button></form><div class="table-responsive mt-4"><table class="table"><thead><tr><th>Room</th><th>From</th><th>Until</th><th>Reason</th><th>Action</th></tr></thead><tbody><tr th:each="b:${blocks}"><td th:text="${b.room.roomNumber}"></td><td th:text="${b.startDate}"></td><td th:text="${b.endDate}"></td><td th:text="${b.reason}"></td><td><form th:if="${b.active}" th:action="@{/staff/rooms/maintenance/{id}/release(id=${b.id})}" method="post"><button class="btn btn-outline-warning" data-confirm="Release this maintenance block?">Release</button></form><span th:unless="${b.active}">Released</span></td></tr></tbody></table></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
