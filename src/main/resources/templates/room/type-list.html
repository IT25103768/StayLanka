<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Room types')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: alerts}"></div><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 section-title">Room types</h1><p class="text-secondary mb-0">Shared capacity, bed, amenity, and base-price definitions.</p></div><a class="btn btn-gold" th:href="@{/admin/room-types/new}">Add room type</a></div><div class="card"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Name</th><th>Capacity</th><th>Bed information</th><th>Base price</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="t : ${roomTypes}"><td th:text="${t.name}"></td><td th:text="${t.capacity}"></td><td th:text="${t.bedInformation}"></td><td th:text="${'LKR ' + #numbers.formatDecimal(t.basePrice,1,2)}"></td><td><span class="badge" th:classappend="${t.active} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${t.active ? 'Active' : 'Inactive'}"></span></td><td class="text-end"><div class="d-flex justify-content-end gap-1"><a class="btn btn-sm btn-outline-success" th:href="@{/admin/room-types/{id}/edit(id=${t.id})}">Edit</a><form th:action="@{/admin/room-types/{id}/toggle-active(id=${t.id})}" method="post"><button class="btn btn-sm btn-outline-danger" th:text="${t.active ? 'Deactivate' : 'Activate'}"></button></form></div></td></tr></tbody></table></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
