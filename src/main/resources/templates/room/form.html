<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${roomId == null ? 'Add room' : 'Edit room'})}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: alerts}"></div><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="card p-4"><h1 class="h3 section-title" th:text="${roomId == null ? 'Add room' : 'Edit room'}"></h1><form enctype="multipart/form-data" th:action="${roomId == null ? '/staff/rooms' : '/staff/rooms/' + roomId}" th:object="${roomForm}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div><div class="row g-3"><div class="col-md-4"><label class="form-label required">Room number</label><input class="form-control" th:field="*{roomNumber}"><div class="text-danger small" th:errors="*{roomNumber}"></div></div><div class="col-md-8"><label class="form-label required">Room type</label><select class="form-select" th:field="*{roomTypeId}"><option value="">Choose type</option><option th:each="t : ${roomTypes}" th:value="${t.id}" th:text="${t.name + (t.active ? '' : ' (inactive)')}"></option></select><div class="text-danger small" th:errors="*{roomTypeId}"></div></div><div class="col-md-6"><label class="form-label required">Nightly price (LKR)</label><input class="form-control" type="number" step="0.01" th:field="*{nightlyPrice}"><div class="text-danger small" th:errors="*{nightlyPrice}"></div></div><div class="col-md-6"><label class="form-label required">Operational status</label><select class="form-select" th:field="*{status}"><option th:each="s : ${roomStatuses}" th:value="${s}" th:text="${s}"></option></select></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" rows="4" th:field="*{description}"></textarea><div class="text-danger small" th:errors="*{description}"></div></div><div class="col-12"><label class="form-label">Room image</label><input class="form-control" type="file" accept="image/jpeg,image/png,image/webp" th:field="*{image}"><div class="form-text">JPEG, PNG, or WebP; maximum 2 MB.</div></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-gold" type="submit">Save room</button><a class="btn btn-outline-secondary" th:href="@{/staff/rooms}">Cancel</a></div></form></div></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
