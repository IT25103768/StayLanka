<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${typeId == null ? 'Add room type' : 'Edit room type'})}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="card p-4"><h1 class="h3 section-title" th:text="${typeId == null ? 'Add room type' : 'Edit room type'}"></h1><form th:action="${typeId == null ? '/admin/room-types' : '/admin/room-types/' + typeId}" th:object="${roomTypeForm}" method="post"><div class="row g-3"><div class="col-md-8"><label class="form-label required">Name</label><input class="form-control" th:field="*{name}"><div class="text-danger small" th:errors="*{name}"></div></div><div class="col-md-4"><label class="form-label required">Capacity</label><input class="form-control" type="number" min="1" th:field="*{capacity}"><div class="text-danger small" th:errors="*{capacity}"></div></div><div class="col-md-7"><label class="form-label required">Bed information</label><input class="form-control" th:field="*{bedInformation}"><div class="text-danger small" th:errors="*{bedInformation}"></div></div><div class="col-md-5"><label class="form-label required">Base price (LKR)</label><input class="form-control" type="number" step="0.01" th:field="*{basePrice}"><div class="text-danger small" th:errors="*{basePrice}"></div></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" rows="3" th:field="*{description}"></textarea></div><div class="col-12"><label class="form-label">Amenities</label><textarea class="form-control" rows="3" th:field="*{amenities}" placeholder="Comma-separated amenities"></textarea></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-gold">Save room type</button><a class="btn btn-outline-secondary" th:href="@{/admin/room-types}">Cancel</a></div></form></div></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
