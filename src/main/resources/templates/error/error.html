<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-5">
    <section class="card sl-error-card">
        <div class="sl-error-code" th:text="${status}">Error</div>
        <span class="sl-eyebrow mt-3">StayLanka</span>
        <h1 class="h2 section-title" th:text="${title}">Something went wrong</h1>
        <p class="text-secondary" th:text="${message}">The request could not be completed.</p>
        <div class="d-flex justify-content-center gap-2 flex-wrap mt-3"><a class="btn btn-gold" th:href="@{/}">Return Home</a><a class="btn btn-outline-success" th:href="@{/rooms}">Browse Rooms</a></div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
