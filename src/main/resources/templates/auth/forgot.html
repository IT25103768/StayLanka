<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Recover your account')}"></head>
<body><nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: alerts}"></div>
<main id="main-content" class="container py-5"><header class="mb-4"><span class="sl-eyebrow">StayLanka / Recover your account</span><h1>Recover your account</h1></header>
<section class="card p-4 sl-narrow"><p>Request recovery, then contact the hotel. An administrator verifies your identity before securely providing a single-use token. No email is sent automatically.</p><form th:action="@{/forgot-password}" method="post"><label for="email" class="form-label">Account email</label><input id="email" name="email" type="email" maxlength="190" required class="form-control" autocomplete="email"><button class="btn btn-gold mt-3">Request recovery</button></form><a th:href="@{/reset-password}" class="mt-3">I have a recovery token</a></section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
