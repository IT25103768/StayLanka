<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Payments | StayLanka')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: alerts}"></div><link rel="stylesheet" th:href="@{/css/payments.css}">
<main id="main-content" class="pay-page"><span class="sl-eyebrow">Hotel payment ledger</span><h1>Payments &amp; receipts</h1><p class="text-secondary">Open a reservation to record money received at the hotel or an actual refund.</p>
<form method="get" th:action="@{/payments}" class="d-flex gap-2 mb-4"><label for="paySearch" class="visually-hidden">Reservation reference, room or customer email</label><input class="form-control" id="paySearch" name="q" th:value="${q}" maxlength="255" placeholder="Reservation reference, room or customer email"><button class="btn pay-gold">Search</button></form>
<div class="pay-panel pay-table"><table class="table align-middle"><thead><tr><th>Reservation</th><th>Customer</th><th>Status</th><th>Total LKR</th><th>Action</th></tr></thead><tbody><tr th:each="r:${reservations}"><td th:text="${r.reservationReference}"></td><td th:text="${r.customer.fullName}"></td><td th:text="${r.status}"></td><td th:text="${#numbers.formatDecimal(r.totalAmount,1,'COMMA',2,'POINT')}"></td><td><a class="btn btn-sm pay-gold" th:href="@{/payments/reservations/{id}(id=${r.id})}">Payment account</a></td></tr><tr th:if="${reservations.empty}"><td colspan="5">No matching reservations.</td></tr></tbody></table></div>
<nav class="pay-actions" th:if="${reservations.totalPages>1}" aria-label="Payment account pages"><a th:unless="${reservations.first}" th:href="@{/payments(q=${q},page=${reservations.number-1})}">Previous</a><span th:text="${'Page '+(reservations.number+1)+' of '+reservations.totalPages}"></span><a th:unless="${reservations.last}" th:href="@{/payments(q=${q},page=${reservations.number+1})}">Next</a></nav></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
