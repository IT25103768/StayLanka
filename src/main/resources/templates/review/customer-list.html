<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My reviews')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<header class="sl-page-header"><div class="container"><div class="row align-items-center g-3"><div class="col-lg-8"><span class="sl-eyebrow">Guest account</span><h1 class="mb-2">My reviews</h1><p class="text-secondary mb-0">Reviews are linked to completed stays. Editing an approved review returns it to moderation.</p></div><div class="col-lg-4 d-lg-flex justify-content-lg-end"><a class="btn btn-outline-success" th:href="@{/customer/stays}"><i class="bi bi-clock-history"></i>Stay History</a></div></div></div></header>
<main class="container py-5">
    <div class="row g-4" th:unless="${reviews.empty}">
        <div class="col-md-6" th:each="review : ${reviews}">
            <article class="card sl-review-card">
                <div class="d-flex justify-content-between gap-3"><span class="sl-review-stars" th:text="${review.rating + ' / 5 ★'}"></span><span class="sl-status" th:classappend="${' sl-status--' + #strings.toLowerCase(review.status.name())}" th:text="${#strings.capitalize(#strings.toLowerCase(review.status.name()))}"></span></div>
                <blockquote class="sl-review-quote" th:text="${'“' + review.comment + '”'}"></blockquote>
                <small class="text-secondary" th:text="${review.stay.room.roomType.name}"></small>
                <div class="d-flex gap-2 mt-3"><a class="btn btn-sm btn-outline-success" th:href="@{/customer/reviews/{id}/edit(id=${review.id})}">Edit</a><form th:action="@{/customer/reviews/{id}/delete(id=${review.id})}" method="post"><button class="btn btn-sm btn-outline-danger" type="submit" data-confirm="Delete this review?">Delete</button></form></div>
            </article>
        </div>
    </div>
    <div th:if="${reviews.empty}" class="card empty-state"><i class="bi bi-star fs-1"></i><h2 class="h4 mt-3">No reviews submitted</h2><p>Completed stays that are eligible for review can be found in your stay history.</p><a class="btn btn-outline-success mx-auto" th:href="@{/customer/stays}">View Stay History</a></div>
    <nav class="mt-4" th:if="${reviews.totalPages > 1}" aria-label="Review pages"><ul class="pagination justify-content-center"><li class="page-item" th:classappend="${reviews.first} ? 'disabled'"><a class="page-link" th:href="@{/customer/reviews(page=${reviews.number-1})}">Previous</a></li><li class="page-item disabled"><span class="page-link" th:text="${'Page ' + (reviews.number+1) + ' of ' + reviews.totalPages}"></span></li><li class="page-item" th:classappend="${reviews.last} ? 'disabled'"><a class="page-link" th:href="@{/customer/reviews(page=${reviews.number+1})}">Next</a></li></ul></nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
