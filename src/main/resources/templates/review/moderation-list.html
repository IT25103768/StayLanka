<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Review moderation')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: alerts}"></div><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 section-title">Review moderation</h1><p class="text-secondary mb-0">Only approved reviews appear publicly.</p></div><form method="get"><select class="form-select" name="status" onchange="this.form.submit()"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == selectedStatus}"></option></select></form></div><div class="row g-3"><div class="col-lg-6" th:each="r : ${reviews}"><div class="card p-4"><div class="d-flex justify-content-between"><span class="stars" th:text="${r.rating + ' / 5 ★'}"></span><span class="badge text-bg-secondary" th:text="${r.status}"></span></div><p class="mt-3" th:text="${r.comment}"></p><small class="text-secondary" th:text="${r.customer.fullName + ' · ' + r.stay.room.roomType.name}"></small><div class="d-flex gap-2 mt-3"><form th:action="@{/admin/reviews/{id}/approve(id=${r.id})}" method="post"><button class="btn btn-sm btn-success">Approve</button></form><form th:action="@{/admin/reviews/{id}/reject(id=${r.id})}" method="post"><button class="btn btn-sm btn-outline-danger">Reject</button></form></div></div></div></div><div th:if="${reviews.empty}" class="card empty-state">No reviews in this moderation state.</div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
