<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Review your stay')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><div class="card p-4"><small class="text-secondary" th:text="${stay.room.roomType.name + ' · ' + stay.reservation.reservationReference}"></small><h1 class="h3 section-title" th:text="${reviewId == null ? 'Review your stay' : 'Edit review'}"></h1><form th:action="${reviewId == null ? '/customer/reviews?stayId=' + stayId : '/customer/reviews/' + reviewId}" th:object="${reviewForm}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div><div class="mb-3"><label class="form-label required">Rating</label><select class="form-select" th:field="*{rating}"><option value="5">5 — Excellent</option><option value="4">4 — Very good</option><option value="3">3 — Good</option><option value="2">2 — Fair</option><option value="1">1 — Poor</option></select></div><div class="mb-3"><label class="form-label required">Comment</label><textarea class="form-control" rows="6" th:field="*{comment}" minlength="10" maxlength="2000"></textarea><div class="text-danger small" th:errors="*{comment}"></div></div><div class="d-flex gap-2"><button class="btn btn-gold">Submit review</button><a class="btn btn-outline-secondary" th:href="@{/customer/reviews}">Cancel</a></div></form></div></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
