<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Stay management')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: alerts}"></div><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 section-title" th:text="${completed ? 'Completed stays' : 'Current stays'}"></h1><p class="text-secondary mb-0">Manage charges and complete guest check-out.</p></div><div class="btn-group"><a class="btn" th:classappend="${!completed} ? 'btn-success' : 'btn-outline-success'" th:href="@{/staff/stays(completed=false)}">Current</a><a class="btn" th:classappend="${completed} ? 'btn-success' : 'btn-outline-success'" th:href="@{/staff/stays(completed=true)}">Completed</a></div></div><div class="card"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Reservation</th><th>Guest</th><th>Room</th><th>Checked in</th><th>Checked out</th><th>Current total</th><th></th></tr></thead><tbody><tr th:each="s : ${stays}"><td th:text="${s.reservation.reservationReference}"></td><td th:text="${s.reservation.customer.fullName}"></td><td th:text="${s.room.roomNumber}"></td><td th:text="${#temporals.format(s.actualCheckIn, 'yyyy-MM-dd HH:mm')}"></td><td th:text="${s.actualCheckOut == null ? '—' : #temporals.format(s.actualCheckOut, 'yyyy-MM-dd HH:mm')}"></td><td th:text="${'LKR ' + #numbers.formatDecimal(s.finalTotal == null ? s.roomCharge + s.additionalChargeTotal : s.finalTotal,1,2)}"></td><td><a class="btn btn-sm btn-outline-success" th:href="@{/staff/stays/{id}(id=${s.id})}">Open</a></td></tr></tbody></table><div th:if="${stays.empty}" class="empty-state" th:text="${completed ? 'No completed stays.' : 'No guests are currently checked in.'}"></div></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
