<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Check in guest')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><main class="container py-5"><div class="row g-4"><div class="col-lg-5"><div class="card p-4"><small class="text-secondary">Confirmed reservation</small><h1 class="h4 section-title" th:text="${reservation.reservationReference}"></h1><dl class="row"><dt class="col-5">Guest</dt><dd class="col-7" th:text="${reservation.customer.fullName}"></dd><dt class="col-5">Room</dt><dd class="col-7" th:text="${reservation.room.roomNumber + ' · ' + reservation.room.roomType.name}"></dd><dt class="col-5">Dates</dt><dd class="col-7" th:text="${reservation.checkInDate + ' – ' + reservation.checkOutDate}"></dd></dl></div></div><div class="col-lg-7"><div class="card p-4"><h2 class="h4 section-title">Check-in details</h2><form th:action="@{/staff/check-ins/{id}(id=${reservation.id})}" th:object="${checkInForm}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div><div class="mb-3"><label class="form-label required">Actual check-in time</label><input class="form-control" type="datetime-local" th:field="*{actualCheckIn}"><div class="text-danger small" th:errors="*{actualCheckIn}"></div></div><div class="mb-3"><label class="form-label required">Actual guest count</label><input class="form-control" type="number" min="1" th:attr="max=${reservation.room.roomType.capacity}" th:field="*{guestCount}"><div class="text-danger small" th:errors="*{guestCount}"></div></div><div class="mb-3"><label class="form-label">Operational notes</label><textarea class="form-control" rows="4" th:field="*{notes}"></textarea></div><label class="d-block mb-3"><input type="checkbox" th:field="*{identityVerified}" required> I verified the guest's identity document against this reservation.</label><div class="text-danger small" th:errors="*{identityVerified}"></div><button class="btn btn-gold" data-confirm="Confirm check-in and mark the room occupied?">Complete check-in</button></form></div></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
