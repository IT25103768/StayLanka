<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Edit charge')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-6"><div class="card p-4"><h1 class="h3 section-title">Edit additional charge</h1><p class="text-secondary" th:text="${'Stay ' + stay.reservation.reservationReference}"></p><form th:action="@{/staff/stays/{stayId}/charges/{chargeId}(stayId=${stay.id},chargeId=${chargeId})}" th:object="${additionalChargeForm}" method="post"><div class="mb-3"><label class="form-label required">Description</label><input class="form-control" th:field="*{description}"><div class="text-danger small" th:errors="*{description}"></div></div><div class="row g-3"><div class="col-6"><label class="form-label required">Quantity</label><input class="form-control" type="number" min="1" th:field="*{quantity}"></div><div class="col-6"><label class="form-label required">Unit price</label><input class="form-control" type="number" min="0.01" step="0.01" th:field="*{unitPrice}"></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-gold">Save charge</button><a class="btn btn-outline-secondary" th:href="@{/staff/stays/{id}(id=${stay.id})}">Cancel</a></div></form></div></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
