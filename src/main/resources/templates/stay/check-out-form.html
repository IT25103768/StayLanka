<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Check out guest')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="card p-4"><h1 class="h3 section-title">Check out guest</h1><p class="text-secondary" th:text="${stay.reservation.reservationReference + ' · Room ' + stay.room.roomNumber}"></p><div class="table-responsive"><table class="table"><thead><tr><th>Item</th><th class="text-end">Amount</th></tr></thead><tbody><tr><td>Reservation charge</td><td class="text-end" th:text="${'LKR ' + #numbers.formatDecimal(stay.roomCharge,1,2)}"></td></tr><tr th:each="c : ${charges}"><td th:text="${c.description + ' × ' + c.quantity}"></td><td class="text-end" th:text="${'LKR ' + #numbers.formatDecimal(c.subtotal,1,2)}"></td></tr></tbody><tfoot><tr class="fw-bold"><td>Final total</td><td class="text-end" th:text="${'LKR ' + #numbers.formatDecimal(stay.roomCharge + stay.additionalChargeTotal,1,2)}"></td></tr></tfoot></table></div><form th:action="@{/staff/stays/{id}/check-out(id=${stay.id})}" th:object="${checkOutForm}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div><label class="form-label required">Actual check-out time</label><input class="form-control" type="datetime-local" th:field="*{actualCheckOut}"><div class="text-danger small" th:errors="*{actualCheckOut}"></div><div class="d-flex gap-2 mt-4"><button class="btn btn-gold" data-confirm="Complete check-out and release the room?">Complete check-out</button><a class="btn btn-outline-secondary" th:href="@{/staff/stays/{id}(id=${stay.id})}">Cancel</a></div></form></div></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
