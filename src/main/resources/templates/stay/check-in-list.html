<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Eligible check-ins')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: alerts}"></div><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 section-title">Eligible check-ins</h1><p class="text-secondary mb-0">Confirmed reservations appear here; date eligibility is rechecked during check-in.</p></div><a class="btn btn-outline-secondary" th:href="@{/staff/stays}">Current stays</a></div><div class="card"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Reference</th><th>Guest</th><th>Room</th><th>Dates</th><th>Guests</th><th></th></tr></thead><tbody><tr th:each="r : ${reservations}"><td class="fw-bold" th:text="${r.reservationReference}"></td><td><span th:text="${r.customer.fullName}"></span><br><small th:text="${r.customer.user.email}"></small></td><td th:text="${r.room.roomNumber + ' · ' + r.room.roomType.name}"></td><td th:text="${r.checkInDate + ' – ' + r.checkOutDate}"></td><td th:text="${r.guestCount}"></td><td class="text-end"><a class="btn btn-sm btn-gold" th:href="@{/staff/check-ins/{id}(id=${r.id})}">Check in</a></td></tr></tbody></table><div th:if="${reservations.empty}" class="empty-state">No confirmed reservations are waiting for check-in.</div></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
