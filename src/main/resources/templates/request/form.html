<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Guest request')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="card p-4"><h1 class="h3 section-title" th:text="${requestId == null ? 'New inquiry or special request' : 'Edit request'}"></h1><p class="text-secondary">Submitted requests can be edited until staff begins processing them.</p><form th:action="${requestId == null ? '/customer/requests' : '/customer/requests/' + requestId}" th:object="${guestRequestForm}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div><div class="row g-3"><div class="col-md-6"><label class="form-label required">Request type</label><select class="form-select" th:field="*{type}"><option value="">Choose type</option><option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option></select></div><div class="col-md-6"><label class="form-label required">Priority</label><select class="form-select" th:field="*{priority}"><option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"></option></select></div><div class="col-md-6"><label class="form-label required">Category</label><input class="form-control" th:field="*{category}" placeholder="Booking, arrival, accessibility, food..."><div class="text-danger small" th:errors="*{category}"></div></div><div class="col-md-6"><label class="form-label">Related reservation</label><select class="form-select" th:field="*{reservationId}"><option value="">No reservation link</option><option th:each="r : ${reservations}" th:value="${r.id}" th:text="${r.reservationReference + ' · ' + r.checkInDate}"></option></select></div><div class="col-12"><label class="form-label required">Subject</label><input class="form-control" th:field="*{subject}"><div class="text-danger small" th:errors="*{subject}"></div></div><div class="col-12"><label class="form-label required">Description</label><textarea class="form-control" rows="6" th:field="*{description}"></textarea><div class="text-danger small" th:errors="*{description}"></div></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-gold">Submit request</button><a class="btn btn-outline-secondary" th:href="@{/customer/requests}">Cancel</a></div></form></div></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
