<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Request queue')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: alerts}"></div><main class="container py-4"><div class="mb-4"><h1 class="h3 section-title">Inquiry & special-request queue</h1><p class="text-secondary mb-0">Filter, assign, respond, and track every status change.</p></div><form class="card p-3 mb-4" method="get"><div class="row g-2"><div class="col-lg-4"><input class="form-control" name="q" th:value="${q}" placeholder="Reference, subject, or email"></div><div class="col-md-4 col-lg-2"><select class="form-select" name="status"><option value="">All statuses</option><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == selectedStatus}"></option></select></div><div class="col-md-4 col-lg-2"><select class="form-select" name="priority"><option value="">All priorities</option><option th:each="p : ${priorities}" th:value="${p}" th:text="${p}" th:selected="${p == selectedPriority}"></option></select></div><div class="col-md-4 col-lg-2"><select class="form-select" name="type"><option value="">All types</option><option th:each="t : ${types}" th:value="${t}" th:text="${t}" th:selected="${t == selectedType}"></option></select></div><div class="col-lg-2"><button class="btn btn-success w-100">Filter</button></div></div></form><div class="card"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Reference</th><th>Customer</th><th>Subject</th><th>Priority</th><th>Status</th><th>Owner</th><th></th></tr></thead><tbody><tr th:each="r : ${requests}"><td class="fw-bold" th:text="${r.requestReference}"></td><td><span th:text="${r.customer.fullName}"></span><br><small th:text="${r.customer.user.email}"></small></td><td><span th:text="${r.subject}"></span><br><small class="text-secondary" th:text="${r.type}"></small></td><td><span class="badge text-bg-light" th:text="${r.priority}"></span></td><td><span class="badge text-bg-secondary" th:text="${r.status}"></span></td><td th:text="${r.assignedStaff == null ? 'Unassigned' : r.assignedStaff.email}"></td><td><a class="btn btn-sm btn-outline-success" th:href="@{/staff/requests/{id}(id=${r.id})}">Open</a></td></tr></tbody></table><div th:if="${requests.empty}" class="empty-state">No requests matched the filters.</div></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
