<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Promotion form')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="card p-4"><h1 class="h3 section-title" th:text="${promotionId == null ? 'New promotion' : 'Edit promotion'}"></h1><form th:action="${promotionId == null ? '/admin/promotions' : '/admin/promotions/' + promotionId}" th:object="${promotionForm}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div><div class="row g-3"><div class="col-md-5"><label class="form-label required">Code</label><input class="form-control text-uppercase" th:field="*{code}"><div class="text-danger small" th:errors="*{code}"></div></div><div class="col-md-7"><label class="form-label required">Name</label><input class="form-control" th:field="*{name}"><div class="text-danger small" th:errors="*{name}"></div></div><div class="col-md-6"><label class="form-label required">Discount type</label><select class="form-select" th:field="*{type}"><option value="">Choose</option><option th:each="t : ${promotionTypes}" th:value="${t}" th:text="${t}"></option></select></div><div class="col-md-6"><label class="form-label required">Value</label><input class="form-control" type="number" min="0.01" step="0.01" th:field="*{value}"><div class="text-danger small" th:errors="*{value}"></div></div><div class="col-md-6"><label class="form-label required">Start date</label><input class="form-control" type="date" th:field="*{startDate}"></div><div class="col-md-6"><label class="form-label required">End date</label><input class="form-control" type="date" th:field="*{endDate}"></div><div class="col-md-6"><label class="form-label required">Minimum nights</label><input class="form-control" type="number" min="1" th:field="*{minimumNights}"></div><div class="col-md-6"><label class="form-label required">Minimum reservation amount</label><input class="form-control" type="number" min="0" step="0.01" th:field="*{minimumAmount}"></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" rows="3" th:field="*{description}"></textarea></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-gold">Save promotion</button><a class="btn btn-outline-secondary" th:href="@{/admin/promotions}">Cancel</a></div></form></div></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
