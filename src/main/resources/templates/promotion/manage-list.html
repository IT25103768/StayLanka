<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Manage promotions')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: alerts}"></div><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 section-title">Promotion management</h1><p class="text-secondary mb-0">Percentage and fixed discounts use separate calculation strategies.</p></div><a class="btn btn-gold" th:href="@{/admin/promotions/new}">New promotion</a></div><div class="card"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Code</th><th>Name</th><th>Discount</th><th>Dates</th><th>Eligibility</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="p : ${promotions}"><td class="fw-bold text-success" th:text="${p.code}"></td><td th:text="${p.name}"></td><td th:text="${p.type.name() == 'PERCENTAGE' ? p.value + '%' : 'LKR ' + p.value}"></td><td th:text="${p.startDate + ' – ' + p.endDate}"></td><td th:text="${p.minimumNights + ' night(s), LKR ' + p.minimumAmount}"></td><td><span class="badge" th:classappend="${p.active} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${p.active ? 'Active' : 'Inactive'}"></span></td><td><div class="d-flex gap-1"><a class="btn btn-sm btn-outline-success" th:href="@{/admin/promotions/{id}/edit(id=${p.id})}">Edit</a><form th:action="@{/admin/promotions/{id}/toggle-active(id=${p.id})}" method="post"><button class="btn btn-sm btn-outline-danger" th:text="${p.active ? 'Deactivate' : 'Activate'}"></button></form></div></td></tr></tbody></table></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
