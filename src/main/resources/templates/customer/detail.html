<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Customer details')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: alerts}"></div><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="card p-4"><div class="d-flex justify-content-between"><div><small class="text-secondary">Customer profile</small><h1 class="h3 section-title" th:text="${profile.fullName}"></h1></div><span class="badge align-self-start" th:classappend="${profile.user.active} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${profile.user.active ? 'Active' : 'Inactive'}"></span></div><dl class="row mt-4"><dt class="col-sm-4">Email</dt><dd class="col-sm-8" th:text="${profile.user.email}"></dd><dt class="col-sm-4">Phone</dt><dd class="col-sm-8" th:text="${profile.phone ?: 'Not supplied'}"></dd><dt class="col-sm-4">Nationality</dt><dd class="col-sm-8" th:text="${profile.nationality ?: 'Not supplied'}"></dd><dt class="col-sm-4">Address</dt><dd class="col-sm-8" th:text="${profile.address ?: 'Not supplied'}"></dd><th:block sec:authorize="hasRole('ADMIN')"><dt class="col-sm-4">NIC / passport</dt><dd class="col-sm-8" th:text="${profile.identificationNumber ?: 'Not supplied'}"></dd></th:block></dl><div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/staff/customers}">Back</a><form sec:authorize="hasRole('ADMIN')" th:action="@{/admin/customers/{id}/toggle-active(id=${profile.id})}" method="post"><button class="btn btn-outline-danger" data-confirm="Change this customer's account status?" type="submit" th:text="${profile.user.active ? 'Deactivate account' : 'Activate account'}"></button></form></div></div></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
