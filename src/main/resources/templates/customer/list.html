<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Customers')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: alerts}"></div><main class="container py-4"><div class="d-flex justify-content-between align-items-end mb-4"><div><h1 class="h3 section-title">Customers</h1><p class="text-secondary mb-0">Search operational contact details and history.</p></div></div><form class="card p-3 mb-4" method="get" th:action="@{/staff/customers}"><div class="input-group"><input class="form-control" name="q" th:value="${q}" placeholder="Name, email, or phone"><button class="btn btn-success">Search</button></div></form><div class="card"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="c : ${customers}"><td th:text="${c.fullName}"></td><td th:text="${c.user.email}"></td><td th:text="${c.phone ?: '—'}"></td><td><span class="badge" th:classappend="${c.user.active} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${c.user.active ? 'Active' : 'Inactive'}"></span></td><td class="text-end"><a class="btn btn-sm btn-outline-success" th:href="@{/staff/customers/{id}(id=${c.id})}">View</a></td></tr></tbody></table><div th:if="${customers.empty}" class="empty-state">No customers matched your search.</div></div></div><nav class="mt-3" th:if="${customers.totalPages > 1}"><ul class="pagination justify-content-center"><li class="page-item" th:classappend="${customers.first} ? 'disabled'"><a class="page-link" th:href="@{/staff/customers(q=${q},page=${customers.number-1})}">Previous</a></li><li class="page-item disabled"><span class="page-link" th:text="${(customers.number+1) + ' / ' + customers.totalPages}"></span></li><li class="page-item" th:classappend="${customers.last} ? 'disabled'"><a class="page-link" th:href="@{/staff/customers(q=${q},page=${customers.number+1})}">Next</a></li></ul></nav></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
