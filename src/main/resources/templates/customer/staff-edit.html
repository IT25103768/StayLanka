<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Edit customer profile')}"></head>
<body><nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: alerts}"></div>
<main id="main-content" class="container py-5"><header class="mb-4"><span class="sl-eyebrow">StayLanka / Edit customer profile</span><h1>Edit customer profile</h1></header>
<form th:action="@{/admin/customers/{id}/edit(id=${profileId})}" th:object="${profileForm}" method="post" class="card p-4"><div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert"><p th:each="err:${#fields.allErrors()}" th:text="${err}"></p></div><div class="row g-3"><div class="col-md-6"><label for="firstName" class="form-label">First name</label><input id="firstName" type="text" th:field="*{firstName}" class="form-control" required><span class="text-danger small" th:errors="*{firstName}"></span></div><div class="col-md-6"><label for="lastName" class="form-label">Last name</label><input id="lastName" type="text" th:field="*{lastName}" class="form-control" required><span class="text-danger small" th:errors="*{lastName}"></span></div><div class="col-md-6"><label for="phone" class="form-label">Telephone</label><input id="phone" type="tel" th:field="*{phone}" class="form-control" ><span class="text-danger small" th:errors="*{phone}"></span></div><div class="col-md-6"><label for="address" class="form-label">Address</label><input id="address" type="text" th:field="*{address}" class="form-control" ><span class="text-danger small" th:errors="*{address}"></span></div><div class="col-md-6"><label for="nationality" class="form-label">Nationality</label><input id="nationality" type="text" th:field="*{nationality}" class="form-control" ><span class="text-danger small" th:errors="*{nationality}"></span></div><div class="col-md-6"><label for="identificationNumber" class="form-label">Identity document reference</label><input id="identificationNumber" type="text" th:field="*{identificationNumber}" class="form-control" ><span class="text-danger small" th:errors="*{identificationNumber}"></span></div></div><label for="preferences" class="form-label mt-3">Stay preferences</label><textarea id="preferences" th:field="*{preferences}" maxlength="1000" class="form-control"></textarea><label class="d-block mt-3"><input type="checkbox" th:field="*{marketingConsent}"> Guest consents to marketing communications (optional)</label><button class="btn btn-gold mt-4">Save profile</button></form>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
