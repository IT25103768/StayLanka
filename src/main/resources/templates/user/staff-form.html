<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Create staff')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><div class="card p-4"><h1 class="h3 section-title">Create staff account</h1><p class="text-secondary">The temporary password should be shared through a secure channel.</p><form th:action="@{/admin/staff}" th:object="${staffForm}" method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label required">First name</label><input class="form-control" th:field="*{firstName}"><div class="text-danger small" th:errors="*{firstName}"></div></div><div class="col-md-6"><label class="form-label required">Last name</label><input class="form-control" th:field="*{lastName}"><div class="text-danger small" th:errors="*{lastName}"></div></div><div class="col-12"><label class="form-label required">Job title</label><input class="form-control" th:field="*{jobTitle}"><div class="text-danger small" th:errors="*{jobTitle}"></div></div><div class="col-12"><label class="form-label required">Email</label><input class="form-control" type="email" th:field="*{email}"><div class="text-danger small" th:errors="*{email}"></div></div><div class="col-12"><label class="form-label required">Temporary password</label><input class="form-control" type="password" th:field="*{password}" autocomplete="new-password"><div class="text-danger small" th:errors="*{password}"></div></div></div><div class="mt-4 d-flex gap-2"><button class="btn btn-gold">Create account</button><a class="btn btn-outline-secondary" th:href="@{/admin/staff}">Cancel</a></div></form></div></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
