<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Staff accounts')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<header class="sl-page-header"><div class="container"><span class="sl-eyebrow">Administration</span><div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3"><div><h1 class="mb-2">Operational staff</h1><p class="text-secondary mb-0">Create, edit, activate, and deactivate authorized module-owner accounts.</p></div><a class="btn btn-gold" th:href="@{/admin/staff/new}"><i class="bi bi-person-plus"></i>Create staff account</a></div></div></header>
<main class="container py-5">
    <form class="card p-3 mb-4" method="get"><div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span><input class="form-control" name="q" th:value="${q}" placeholder="Search login ID"><button class="btn btn-success" type="submit">Search</button></div></form>
    <div class="card"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Login</th><th>Role</th><th>Created</th><th>Status</th><th class="text-end">Actions</th></tr></thead><tbody><tr th:each="u : ${staffPage}"><td><strong th:text="${u.email}"></strong></td><td><span class="badge text-bg-light" th:text="${#strings.replace(u.role.name(), '_', ' ')}"></span></td><td th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy')}"></td><td><span class="badge" th:classappend="${u.active} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${u.active ? 'Active' : 'Inactive'}"></span></td><td class="text-end"><div class="d-inline-flex flex-wrap gap-2 justify-content-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/staff/{id}/edit(id=${u.id})}"><i class="bi bi-pencil"></i>Edit</a><form th:action="@{/admin/staff/{id}/toggle-active(id=${u.id})}" method="post"><button class="btn btn-sm btn-outline-danger" data-confirm="Change this staff account status?" th:text="${u.active ? 'Deactivate' : 'Activate'}"></button></form></div></td></tr></tbody></table><div th:if="${staffPage.empty}" class="empty-state"><i class="bi bi-person-badge fs-1"></i><h2 class="h5 mt-3">No staff accounts found</h2><p class="mb-0">Try a different search or create a new operational account.</p></div></div></div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
