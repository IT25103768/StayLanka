<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Staff accounts')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: alerts}"></div><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 section-title">Staff accounts</h1><p class="text-secondary mb-0">Administrator-created operational accounts.</p></div><a class="btn btn-gold" th:href="@{/admin/staff/new}">Create staff account</a></div><form class="card p-3 mb-4" method="get"><div class="input-group"><input class="form-control" name="q" th:value="${q}" placeholder="Search email"><button class="btn btn-success">Search</button></div></form><div class="card"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Email</th><th>Created</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="u : ${staffPage}"><td th:text="${u.email}"></td><td th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd')}"></td><td><span class="badge" th:classappend="${u.active} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${u.active ? 'Active' : 'Inactive'}"></span></td><td class="text-end"><form th:action="@{/admin/staff/{id}/toggle-active(id=${u.id})}" method="post"><button class="btn btn-sm btn-outline-danger" data-confirm="Change this staff account status?" th:text="${u.active ? 'Deactivate' : 'Activate'}"></button></form></td></tr></tbody></table><div th:if="${staffPage.empty}" class="empty-state">No staff accounts found.</div></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
